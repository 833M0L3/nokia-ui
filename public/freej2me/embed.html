<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia J2ME Midlet Runner</title>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #screen-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #040914;
        }
        #display {
            background-color: #000;
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
            object-contain: contain;
        }
        #display:focus {
            outline: none;
        }
        #loading {
            font-size: 13px;
            color: #38bdf8;
            font-family: monospace;
            text-align: center;
            padding: 10px;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin: 0 auto 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="screen-area">
        <canvas tabindex="0" id="display" style="display: none;"></canvas>
        <div id="loading">
            <div class="spinner"></div>
            <span>Starting Nokia J2ME Engine...</span>
        </div>
    </div>

    <!-- CheerpJ Loader -->
    <script src="https://cjrtnc.leaningtech.com/20260317_2978/loader.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
